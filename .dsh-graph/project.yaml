name: dsh-graph
description: 基于图的目标管理 DSH 插件体系（见 DESIGN.md）
defaults:
  review:
    reviewer: human        # 本期全部由负责人审核
    prompt: null
  pk:
    lanes: 1
    sandbox: directory
  disposition: {}
supervisor:
  session: session-b00ed183-bc6c-4f66-b07e-e5d909c1f46b   # 主管 Agent 会话（g-108 顶部状态栏数据源；换会话时更新）
  automation:
    scope_planning: human      # 版本范围由负责人确认
    integration_decision: human
    rework: human
    memory_promotion: ai       # 我（supervisor）提炼，负责人可随时推翻
    skill_proposal: human
    release: human
executor:
  provider: deepseek-official   # 执行子代理模型路由（DSH DeepSeek 官方 adapter 的 provider 名；graph_start_attempt 参数可覆盖）
  model: deepseek-v4-flash
